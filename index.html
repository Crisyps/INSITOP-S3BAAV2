  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at top right,
          rgba(24, 57, 87, 0.55),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #070b12,
          #0b1422
        );

      color: #f5f7fa;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .contenedor {

      width: 90%;
      max-width: 520px;

      text-align: center;

      padding: 45px 30px;

      border:
        1px solid
        rgba(198, 161, 91, 0.30);

      border-radius: 18px;

      background:
        rgba(11, 20, 34, 0.85);

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.45);

    }


    .escudo {

      width: 130px;
      height: 130px;

      object-fit: contain;

      margin-bottom: 20px;

      filter:
        drop-shadow(
          0 8px 18px
          rgba(0, 0, 0, 0.65)
        );

    }


    .titulo {

      font-size: 32px;

      font-weight: 800;

      letter-spacing: 3px;

      color: #e0c47a;

      margin-bottom: 10px;

    }


    .subtitulo {

      font-size: 14px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #aab3bf;

      margin-bottom: 30px;

    }


    .descripcion {

      color: #d5dae1;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 30px;

    }


    .boton {

      display: inline-block;

      padding:
        14px 28px;

      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #c6a15b,
          #9e793c
        );

      color: #111;

      text-decoration: none;

      font-size: 13px;

      font-weight: 800;

      letter-spacing: 0.8px;

      transition:
        transform 0.2s ease,
        filter 0.2s ease;

    }


    .boton:hover {

      transform:
        translateY(-2px);

      filter:
        brightness(1.1);

    }


    .pie {

      margin-top: 28px;

      color: #68717d;

      font-size: 10px;

      letter-spacing: 1px;

      text-transform: uppercase;

    }


    @media (max-width: 500px) {

      .contenedor {
        padding: 35px 20px;
      }

      .escudo {
        width: 105px;
        height: 105px;
      }

      .titulo {
        font-size: 26px;
      }

      .subtitulo {
        font-size: 11px;
      }

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <img
      class="escudo"
      src="https://raw.githubusercontent.com/Crisyps/fotos-INSITOP/main/ESCUDO.png"
      alt="Escudo BAAV2"
    >

    <div class="titulo">
      BAAV2
    </div>

    <div class="subtitulo">
      Sistema de Información Operacional
    </div>

    <div class="descripcion">
      Batallón de Aviación No. 2
      <br>
      "Asalto Aéreo"
    </div>

    >
      INGRESAR AL SISTEMA 
    </a>


    <div class="pie">
      Sistema de Información Operacional · BAAV2
    </div>

  </div>
